name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    env:
      GOWORK: "off"
      GOFLAGS: "-mod=mod"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: plugin/go.mod
          cache-dependency-path: plugin/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./... && go vet -tags eval ./...
      - name: test
        run: go test -race -count=1 ./...
      - name: build plugin
        run: CGO_ENABLED=1 go build -trimpath -tags sqlite_static -buildmode=plugin -o freshguard.so .

  docker:
    # Proves the one-command setup: Bifrost v2.4.0 + plugin built together, plugin tests run inside.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
